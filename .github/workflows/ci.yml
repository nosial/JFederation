name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 24
        uses: actions/setup-java@v5
        with:
          java-version: 24
          distribution: temurin
          cache: maven

      - name: Build library
        run: mvn -B package -DskipTests

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: jfederation
          path: target/jfederation.jar
          retention-days: 7

  test:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 24
        uses: actions/setup-java@v5
        with:
          java-version: 24
          distribution: temurin
          cache: maven

      - name: Deploy Federation Server environment
        run: |
          docker compose up -d
          echo "Waiting for server to be ready..."
          for i in $(seq 1 60); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:7000/info | grep -q 200; then
              echo "Server is ready!"
              exit 0
            fi
            echo "Attempt $i: server not ready yet, waiting 5 seconds..."
            sleep 5
          done
          echo "Timeout: server did not become ready within 5 minutes"
          exit 1

      - name: Run tests
        run: mvn -B test

  release:
    needs: [build, test]
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 24
        uses: actions/setup-java@v5
        with:
          java-version: 24
          distribution: temurin
          cache: maven

      - name: Configure Maven credentials for GitHub Packages
        run: |
          mkdir -p "$HOME/.m2"
          cat > "$HOME/.m2/settings.xml" <<EOF
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${{ github.actor }}</username>
                <password>${{ secrets.GITHUB_TOKEN }}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Deploy to GitHub Packages
        run: mvn -B deploy -DskipTests

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: target/jfederation.jar
          token: ${{ secrets.GITHUB_TOKEN }}